<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{font-family:Roboto;background:#f4f6fb;margin:0}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#e0e6ff}
.separator th{background:#b9c4ff;font-size:18px}
.olt-name{background:#d6dbff}
.clickable{cursor:pointer;font-weight:600}
#loadingOverlay{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spinner{width:40px;height:40px;border:4px solid #ccc;border-top:4px solid #4a67ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#userModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:1000}
#userModalContent{background:#fff;padding:15px;max-height:90%;overflow:auto;width:90%}
.closeBtn{float:right;font-size:22px;cursor:pointer}
.red{background:#ffb3b3}
.pink{background:#ffd6d6}
#toast{visibility:hidden;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#333;color:#fff;padding:10px 20px;border-radius:6px}
#toast.show{visibility:visible}
</style>
</head>

<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>Preparing…</p>
</div>

<div id="matrixHolder">
<table id="matrixTable">

<tr>
  <th></th><th></th>
  <th>Pon1</th><th>Pon2</th><th>Pon3</th><th>Pon4</th>
  <th>Pon5</th><th>Pon6</th><th>Pon7</th><th>Pon8</th>
  <th>Total</th>
</tr>

<tr class="separator"><th colspan="11">TSN Window</th></tr>

<!-- O1I2 -->
<tr>
<th rowspan="4" class="olt-name">O1I2</th>
<th>Users</th>
<td id="pon1-O1I2" class="clickable"></td>
<td id="pon2-O1I2" class="clickable"></td>
<td id="pon3-O1I2" class="clickable"></td>
<td id="pon4-O1I2" class="clickable"></td>
<td id="pon5-O1I2" class="clickable"></td>
<td id="pon6-O1I2" class="clickable"></td>
<td id="pon7-O1I2" class="clickable"></td>
<td id="pon8-O1I2" class="clickable"></td>
<td id="oltTotal-O1I2"></td>
</tr>
<tr>
<th>Offline</th>
<td id="off1-O1I2" class="clickable"></td>
<td id="off2-O1I2" class="clickable"></td>
<td id="off3-O1I2" class="clickable"></td>
<td id="off4-O1I2" class="clickable"></td>
<td id="off5-O1I2" class="clickable"></td>
<td id="off6-O1I2" class="clickable"></td>
<td id="off7-O1I2" class="clickable"></td>
<td id="off8-O1I2" class="clickable"></td>
<td id="oltOffTotal-O1I2"></td>
</tr>
<tr>
<th>Ticket</th>
<td id="tick1-O1I2" class="clickable"></td>
<td id="tick2-O1I2" class="clickable"></td>
<td id="tick3-O1I2" class="clickable"></td>
<td id="tick4-O1I2" class="clickable"></td>
<td id="tick5-O1I2" class="clickable"></td>
<td id="tick6-O1I2" class="clickable"></td>
<td id="tick7-O1I2" class="clickable"></td>
<td id="tick8-O1I2" class="clickable"></td>
<td id="oltTickTotal-O1I2"></td>
</tr>
<tr>
<th>Line</th>
<td id="stat1-O1I2"></td><td id="stat2-O1I2"></td><td id="stat3-O1I2"></td><td id="stat4-O1I2"></td>
<td id="stat5-O1I2"></td><td id="stat6-O1I2"></td><td id="stat7-O1I2"></td><td id="stat8-O1I2"></td>
<td></td>
</tr>

<!-- O2I3 (same layout) -->
<tr>
<th rowspan="4" class="olt-name">O2I3</th>
<th>Users</th>
<td id="pon1-O2I3"></td><td id="pon2-O2I3"></td><td id="pon3-O2I3"></td><td id="pon4-O2I3"></td>
<td id="pon5-O2I3"></td><td id="pon6-O2I3"></td><td id="pon7-O2I3"></td><td id="pon8-O2I3"></td>
<td id="oltTotal-O2I3"></td>
</tr>
<tr>
<th>Offline</th>
<td id="off1-O2I3"></td><td id="off2-O2I3"></td><td id="off3-O2I3"></td><td id="off4-O2I3"></td>
<td id="off5-O2I3"></td><td id="off6-O2I3"></td><td id="off7-O2I3"></td><td id="off8-O2I3"></td>
<td id="oltOffTotal-O2I3"></td>
</tr>
<tr>
<th>Ticket</th>
<td id="tick1-O2I3"></td><td id="tick2-O2I3"></td><td id="tick3-O2I3"></td><td id="tick4-O2I3"></td>
<td id="tick5-O2I3"></td><td id="tick6-O2I3"></td><td id="tick7-O2I3"></td><td id="tick8-O2I3"></td>
<td id="oltTickTotal-O2I3"></td>
</tr>
<tr>
<th>Line</th>
<td id="stat1-O2I3"></td><td id="stat2-O2I3"></td><td id="stat3-O2I3"></td><td id="stat4-O2I3"></td>
<td id="stat5-O2I3"></td><td id="stat6-O2I3"></td><td id="stat7-O2I3"></td><td id="stat8-O2I3"></td>
<td></td>
</tr>

</table>
</div>

<div id="userModal">
<div id="userModalContent">
<span class="closeBtn" onclick="closeModal()">&times;</span>
<h3 id="modalTitle"></h3>
<div id="userDetails"></div>
</div>
</div>

<div id="toast">No users</div>

<script>
const API_URL = 'https://app.vbo.co.in/TSN/complains';

let oltData = {};

async function loadData(){
  const res = await fetch(API_URL);
  const data = await res.json();
  const rows = data.rows || [];

  document.querySelectorAll('td').forEach(td=>td.textContent='');
  oltData = {};

  rows.forEach(r=>{
    if(!r.Serial) return;
    const ponDigit = r.Serial.slice(-1);
    if(!/[1-8]/.test(ponDigit)) return;

    const pon = 'P'+ponDigit;
    const olt = r.Serial.startsWith('PPCT') ? 'O1I2' : 'O2I3';
    const key = olt+pon;

    if(!oltData[key]) oltData[key]={all:[],off:[],tick:[]};
    oltData[key].all.push(r);
    if(r["User status"]==="DOWN") oltData[key].off.push(r);
    if(r.Ticket) oltData[key].tick.push(r);
  });

  ['O1I2','O2I3'].forEach(olt=>{
    let tot=0,off=0,tick=0;
    for(let i=1;i<=8;i++){
      const k=olt+'P'+i;
      const d=oltData[k]||{all:[],off:[],tick:[]};
      document.getElementById(`pon${i}-${olt}`).textContent=d.all.length||'';
      document.getElementById(`off${i}-${olt}`).textContent=d.off.length||'';
      document.getElementById(`tick${i}-${olt}`).textContent=d.tick.length||'';
      document.getElementById(`stat${i}-${olt}`).textContent=d.off.length?'🔴':'🟢';
      tot+=d.all.length; off+=d.off.length; tick+=d.tick.length;
    }
    document.getElementById(`oltTotal-${olt}`).textContent=tot||'';
    document.getElementById(`oltOffTotal-${olt}`).textContent=off||'';
    document.getElementById(`oltTickTotal-${olt}`).textContent=tick||'';
  });

  document.getElementById('loadingOverlay').style.display='none';
}

function closeModal(){document.getElementById('userModal').style.display='none'}
window.onload=()=>{loadData();setInterval(loadData,30000)}
</script>

</body>
</html>
