<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rack Dashboard | Network Monitoring</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- HTML2Canvas for Screenshots -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-container">
            <div class="spinner"></div>
            <p>Initializing Rack ...</p>
            <div class="loading-details" id="loadingDetails">Connecting to TSN...</div>
        </div>
    </div>

    <!-- Loading Progress Bar -->
    <div id="dataLoading" class="data-loading"></div>

    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-satellite-dish"></i>
                <div>
                    <h1>Rack</h1>
                    <div class="subtitle">TSN Window</div>
                </div>
            </div>
            <div class="sync-info">
                <div class="last-sync">
                    <i class="fas fa-clock"></i>
                    <span>Last Sync:</span>
                    <span id="lastSyncTime" class="sync-time">--:--</span>
                </div>
                <div class="window-info">
                    <div class="window-badge">
                        <i class="fas fa-window-maximize"></i>
                        <span>TSN</span>
                        <span id="oltCount" class="olt-count">0 OLTs</span>
                    </div>
                    <button id="btnRefresh" class="btn-refresh" title="Refresh Data">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="header-right">
            <div class="total-stats">
                <div class="stat-box">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <span class="stat-label">Total Users</span>
                        <span class="stat-value" id="totalUsers">0</span>
                    </div>
                </div>
                <div class="stat-box offline">
                    <div class="stat-icon">
                        <i class="fas fa-wifi-slash"></i>
                    </div>
                    <div class="stat-content">
                        <span class="stat-label">Offline</span>
                        <span class="stat-value" id="totalOffline">0</span>
                    </div>
                </div>
                <div class="stat-box ticket">
                    <div class="stat-icon">
                        <i class="fas fa-ticket-alt"></i>
                    </div>
                    <div class="stat-content">
                        <span class="stat-label">Tickets</span>
                        <span class="stat-value" id="totalTickets">0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="dashboard-container">
        <!-- OLT Cards Container -->
        <div id="oltContainer" class="olt-container">
            <!-- OLT cards will be dynamically generated from data -->
        </div>

        <!-- Mobile Floating Actions -->
        <div class="mobile-actions">
            <button id="btnQuickRefresh" class="fab" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button id="btnScreenshot" class="fab screenshot" title="Screenshot">
                <i class="fas fa-camera"></i>
            </button>
        </div>
    </main>

    <!-- User Details Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">User Details</h2>
                <div class="modal-actions">
                    <button id="btnDownloadCSV" class="btn-small">
                        <i class="fas fa-download"></i> CSV
                    </button>
                    <button id="btnModalScreenshot" class="btn-small btn-primary">
                        <i class="fas fa-camera"></i> Screenshot
                    </button>
                    <button id="btnCloseModal" class="btn-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="modal-subtitle" id="modalSubtitle"></div>
            
            <div class="modal-body" id="modalBody">
                <!-- User details table will be inserted here -->
            </div>
            
            <div class="modal-footer">
                <div class="pagination-info">
                    <i class="fas fa-users"></i>
                    <span id="currentUsersCount">0</span> users shown
                </div>
                <div class="modal-timestamp">
                    <i class="fas fa-clock"></i>
                    <span id="modalTimestamp">--:--</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
