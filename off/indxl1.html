<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complain Manager</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Your external stylesheet -->
  <link rel="stylesheet" href="stylesoff.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <h1>Complain Manager</h1>
  </div>
  <div class="top-controls">
    <button id="btnComplains" class="primary">Complains</button>
    <button id="btnOffline">Offline</button>
    <button id="btnDrops">Drops</button>
  </div>
</header>

<!-- Global Search and Power Range -->
<div class="filters-inline">
  <input id="globalSearch" placeholder="Search anything..." type="text">
  <input id="powerMin" placeholder="Min Power" type="number" step="0.1">
  <input id="powerMax" placeholder="Max Power" type="number" step="0.1">
</div>

<div id="tableWrap">
  <table id="dataTable">
    <thead>
      <tr>
        <th>
          PON
          <select id="filterPon"><option value="">All</option></select>
        </th>
        <th>User ID</th>
        <th>Mobile</th>
        <th>Name</th>
        <th>Mac / Serial</th>
        <th>Down</th>
        <th>Remark</th>
        <th>
          Team
          <select id="filterTeam"><option value="">All</option></select>
        </th>
        <th>
          Mode
          <select id="filterMode"><option value="">All</option></select>
        </th>
        <th>Power</th>
        <th>Complain</th>
        <th>Location</th>
        <th>
          Status
          <select id="filterStatus"><option value="">All</option></select>
        </th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div id="spinnerOverlay">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Import JS -->
<script src="script.js"></script>
</body>
</html>
