<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Complain Manager</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../stylesoff.css">

<style>
/* (tumhara original CSS SAME rakha hai — shorten nahi kiya) */
tbody tr.offline td{background:#fff3f3;}
tbody tr.ticket td{background:#ff5252;color:#fff;}
#spinnerOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.6);z-index:999;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:6px;opacity:0;}
#toast.show{opacity:1;}
</style>
</head>

<body>

<header class="app-header">
  <div class="brand">
    <h1>Complain Manager</h1>
  </div>
  <div class="top-controls">
    <button id="btnComplains" class="primary">Complains</button>
    <button id="btnOffline">Offline</button>
    <button id="btnDrops">Drops</button>
  </div>
</header>

<div id="tableWrap">
<table id="dataTable">
<thead>
<tr>
  <th>PON</th>
  <th>User ID</th>
  <th>Mobile</th>
  <th>Name</th>
  <th>Mac / Serial</th>
  <th>Down</th>
  <th>Remark</th>
  <th>Team</th>
  <th>Power</th>
  <th>Complain</th>
  <th>Location</th>
  <th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="spinnerOverlay">
  <div>Loading…</div>
</div>

<div id="toast"></div>

<script>
/* ===============================
   🔥 REAL API (NO GAS)
================================ */
const API_URL = "https://app.vbo.co.in/TSN/complains";

let rawRows = [];
let filtered = [];
let currentMode = "offline";

const tbody = document.querySelector("#dataTable tbody");
const spinner = document.getElementById("spinnerOverlay");
const toast = document.getElementById("toast");

/* ===============================
   UI HELPERS
================================ */
function showSpinner(){spinner.style.display="flex";}
function hideSpinner(){spinner.style.display="none";}
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),3000);
}

/* ===============================
   DATA FETCH
================================ */
async function fetchData(){
  showSpinner();
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    rawRows = data.rows || [];
    applyMode();
  }catch(err){
    showToast("Failed to load data");
  }finally{
    hideSpinner();
  }
}

/* ===============================
   FILTER MODES
================================ */
function applyMode(){
  if(currentMode==="offline"){
    filtered = rawRows.filter(r => r["User status"]==="DOWN");
  }
  else if(currentMode==="complains"){
    filtered = rawRows.filter(r => r.Ticket && r.Ticket!=="");
  }
  else if(currentMode==="drops"){
    filtered = rawRows.filter(r => r.Drops && r.Drops!=="");
  }
  else{
    filtered = rawRows.slice();
  }
  renderTable();
}

/* ===============================
   TABLE RENDER
================================ */
function renderTable(){
  tbody.innerHTML="";
  filtered.forEach(r=>{
    const tr=document.createElement("tr");

    if(r["User status"]==="DOWN") tr.classList.add("offline");
    if(r.Ticket) tr.classList.add("ticket");

    tr.innerHTML=`
      <td>${r.NMID||""}</td>
      <td>${r.Users||""}</td>
      <td>${r["Last called no"]||""}</td>
      <td>${r.Name||""}</td>
      <td>${r.MAC||""}<br><small>${r.Serial||""}</small></td>
      <td>${r.Drops||""}</td>
      <td><input value="${r.Remarks||""}" disabled></td>
      <td><input value="${r.Team||""}" disabled></td>
      <td>${r.Power!=null?Number(r.Power).toFixed(2):""}</td>
      <td>-</td>
      <td>${r.Location||""}</td>
      <td>${r["User status"]||""}</td>
    `;
    tbody.appendChild(tr);
  });
}

/* ===============================
   BUTTON EVENTS
================================ */
document.getElementById("btnOffline").onclick=()=>{
  currentMode="offline";applyMode();
};
document.getElementById("btnComplains").onclick=()=>{
  currentMode="complains";applyMode();
};
document.getElementById("btnDrops").onclick=()=>{
  currentMode="drops";applyMode();
};

/* ===============================
   START
================================ */
fetchData();
setInterval(fetchData,30000);
</script>

</body>
</html>
